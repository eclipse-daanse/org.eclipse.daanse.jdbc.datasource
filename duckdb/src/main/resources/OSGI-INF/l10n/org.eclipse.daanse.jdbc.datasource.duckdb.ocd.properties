# DuckDB JDBC DataSource Configuration Localization

# OCD Names and Descriptions
ocd.ds.name=DuckDB DataSource Configuration
ocd.ds.description=Configuration for DuckDB DataSource component (embedded database)
ocd.remote.name=DuckDB Remote DataSource Configuration
ocd.remote.description=Configuration for a DuckDB DataSource that is a client of a remote DuckDB server (Quack client/server protocol)

# Property Names and Descriptions
databaseName.name=Database Name
databaseName.description=File path of the database for a persistent database, empty / :memory: for an in-memory database, memory:<label> for a named in-memory database or ducklake:<metadata path>. All connections of one DataSource share its database. Must not contain ';'

readOnly.name=Read Only
readOnly.description=Open the database in read-only mode (file databases only); shorthand for the engine setting access_mode=READ_ONLY
accessMode.name=Access Mode
accessMode.description=DuckDB access_mode: AUTOMATIC (default), READ_ONLY or READ_WRITE. READ_ONLY opens a file database read-only, like readOnly=true; it must not contradict readOnly and wins over an access_mode entry of the settings.

customUserAgent.name=Custom User Agent
customUserAgent.description=Custom string appended to the user agent reported to DuckDB (custom_user_agent)

streamResults.name=Stream Results
streamResults.description=Stream result sets instead of materializing them (jdbc_stream_results). Off by default; on by default for ducklake: databases

autoCommit.name=Auto Commit
autoCommit.description=Default auto-commit mode of new connections (jdbc_auto_commit). On by default

pinDb.name=Pin Database
pinDb.description=Keep the database instance alive after its last connection closes (jdbc_pin_db). The DataSource holds the database open anyway and releases the pin when it is closed. Off by default; on by default for ducklake: databases

instanceCache.name=Instance Cache
instanceCache.description=Reuse the process-wide database instance for the same database (jdbc_instance_cache). On by default; off creates an isolated instance, which may run into file lock conflicts

ignoreUnsupportedOptions.name=Ignore Unsupported Options
ignoreUnsupportedOptions.description=Silently drop settings DuckDB does not know instead of refusing to connect (jdbc_ignore_unsupported_options)

jfrMemoryMonitor.name=JFR Memory Monitor
jfrMemoryMonitor.description=Name under which the database instance is tracked in the duckdb.MemoryUsage JFR event (jdbc_jfr_memory_monitor); empty disables the monitoring

sessionInitSqlFile.name=Session Init SQL File
sessionInitSqlFile.description=Path of a SQL file (max 1MB) run before a connection is handed out (session_init_sql_file): the part above the marker comment /* DUCKDB_CONNECTION_INIT_BELOW_MARKER */ once per database instance, the part below it for every connection. Runs with the full privileges of the connection; the path must not contain ; or =

sessionInitSqlFileSha256.name=Session Init SQL File SHA-256
sessionInitSqlFileSha256.description=Expected SHA-256 digest (hex) of the session init SQL file (session_init_sql_file_sha256); the connection is refused on a mismatch

settings.name=Engine settings
settings.description=DuckDB settings as name=value, one per entry (threads, memory_limit, preserve_insertion_order, ...). Settings configure the database instance: a second embedded DataSource on the same database has to use the same settings. Embedded only: access_mode=READ_ONLY opens a file database read-only, like readOnly=true, and must not contradict readOnly. The dedicated attributes win over an entry of the same option.

remoteUri.name=Remote URI
remoteUri.description=Remote DuckDB server speaking the Quack client/server protocol, quack:<host>[:<port>] (port 9494 by default). The remote is attached to a private in-memory database under the remote alias and is the default catalog of every connection, so unqualified names and the metadata refer to it; the quack extension is installed and loaded on first use. Parameterized statements (?) are not supported on remote tables; for bulk loads append into a local temporary table and run one INSERT INTO <table> SELECT from it. Client settings such as quack_enable_reconnects go into the engine settings. The client caches the catalog of the remote: a table created on the server after the attach, not through this DataSource, stays invisible until CALL quack_clear_cache() is run.
.remoteToken.name=Remote Token
.remoteToken.description=Authentication token of the remote server, handed to DuckDB as a temporary secret scoped to the remote URI. Empty relies on a quack secret that exists already, for example a persistent one.
remoteAlias.name=Remote Alias
remoteAlias.description=Catalog name the remote server is attached under; remote by default
remoteDisableSsl.name=Remote Disable SSL
remoteDisableSsl.description=Talk plain HTTP to the remote server. The client assumes HTTPS for a host that is not local; set this for a non-local server without TLS
