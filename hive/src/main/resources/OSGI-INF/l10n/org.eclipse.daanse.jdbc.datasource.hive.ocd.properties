# Hive JDBC DataSource Configuration Localization

# OCD Names and Descriptions
ocd.ds.name=Hive DataSource Configuration
ocd.ds.description=Configuration for Apache Hive (HiveServer2) DataSource component

# Property Names and Descriptions
.password.name=Password
.password.description=Database password for authentication

user.name=User
user.description=Database username for authentication

portNumber.name=Port Number
portNumber.description=HiveServer2 Thrift port number, default 10000

databaseName.name=Database Name
databaseName.description=Name of the database to connect to

serverName.name=Server Name
serverName.description=Database server hostname or IP address

ssl.name=SSL
ssl.description=Use SSL for the HiveServer2 connection (appends ;ssl=true to the JDBC URL)

sessionConf.name=Session Configuration
sessionConf.description=Semicolon separated key=value pairs appended to the HiveServer2 JDBC URL session-conf part
