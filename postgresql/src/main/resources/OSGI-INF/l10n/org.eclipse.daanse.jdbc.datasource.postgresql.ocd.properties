# Additional PostgreSQL properties
applicationName.name=Application Name
applicationName.description=Specifies a value for the application_name configuration parameter

connectTimeout.name=Connect Timeout
connectTimeout.description=The timeout value used for socket connect operations in seconds (0 = infinite)

currentSchema.name=Current Schema
currentSchema.description=Specify the schema to be set in the search-path

loginTimeout.name=Login Timeout
loginTimeout.description=Specify how long to wait for establishment of a database connection in seconds

socketTimeout.name=Socket Timeout
socketTimeout.description=The timeout value used for socket read operations in seconds (0 = infinite)

ssl.name=SSL
ssl.description=Enable SSL encryption for the connection

sslMode.name=SSL Mode
sslMode.description=SSL connection mode (disable, allow, prefer, require, verify-ca, verify-full)

sslCert.name=SSL Certificate
sslCert.description=Provide the full path for the certificate file

sslKey.name=SSL Key
sslKey.description=Provide the full path for the key file

sslRootCert.name=SSL Root Certificate
sslRootCert.description=File name of the SSL root certificate

defaultRowFetchSize.name=Default Row Fetch Size
defaultRowFetchSize.description=Positive number of rows that should be fetched from the database when more rows are needed

prepareThreshold.name=Prepare Threshold
prepareThreshold.description=Determine the number of PreparedStatement executions required before switching to server-side prepared statements

preparedStatementCacheQueries.name=Prepared Statement Cache Queries
preparedStatementCacheQueries.description=Determine the number of queries that are cached in each connection

loadBalanceHosts.name=Load Balance Hosts
loadBalanceHosts.description=Enable connections to be distributed among multiple PostgreSQL hosts

targetServerType.name=Target Server Type
targetServerType.description=Allows opening connections to only servers with required state (any, master, slave, secondary, preferSlave, preferSecondary)

tcpKeepAlive.name=TCP Keep Alive
tcpKeepAlive.description=Enable TCP keep-alive probe to verify that the database connection is still alive

readOnly.name=Read Only
readOnly.description=Put the connection in read-only mode

